version: '0.1.4'

services:
  mj-comfyui-worker:
    image: mariusjopen/runpod-worker-comfyui:0.1.4
    platform: linux/amd64
    build:
      context: .
      args:
        MY_BASE_IMAGE: timpietruskyblibla/runpod-worker-comfy:3.1.2-base
        IMAGE_TYPE: comfyui
    container_name: mj-comfyui-worker
    environment:
      - COMFYUI_API_URL=https://comfyui-api.example.com
      - COMFYUI_API_TOKEN=your-api-token
      - COMFYUI_API_SECRET=your-api-secret
    restart: always
    ports:
      - "8188:8188"    # ComfyUI port
      - "5678:5678"    # Debugger port
      - "22:22"        # SSH port

  mj-deforum-worker:
    image: mariusjopen/runpod-worker-deforum:0.1.4
    platform: linux/amd64
    build:
      context: .
      args:
        MY_BASE_IMAGE: ghcr.io/ai-dock/stable-diffusion-webui:v2-cuda-12.1.1-base-22.04-v1.10.1
        IMAGE_TYPE: deforum
    container_name: mj-deforum-worker
    environment:
      - WEBUI_ARGS=--xformers --no-half-vae --api --deforum-api # This is required
      - WEBUI_VENV=/workspace/environments/python/webui
      - WORKSPACE=/workspace
    ports:
      - "17860:17860"  # Web UI port
      - "5678:5678"    # Debugger port
      - "22:22"        # SSH port
    restart: always

  mj-a1111-worker:
    image: mariusjopen/runpod-worker-a1111:0.1.4
    platform: linux/amd64
    build:
      context: .
      args:
        MY_BASE_IMAGE: ghcr.io/ai-dock/stable-diffusion-webui:v2-cuda-12.1.1-base-22.04-v1.10.1
        IMAGE_TYPE: a1111
    container_name: mj-a1111-worker
    environment:
      - WEBUI_ARGS=--xformers --no-half-vae --api --deforum-api # This is required
      - WEBUI_VENV=/workspace/environments/python/webui
      - WORKSPACE=/workspace
    ports:
      - "17860:17860"  # Web UI port
      - "5678:5678"    # Debugger port
      - "22:22"        # SSH port
    restart: always

